kind = "web"
previewPath = "/"
title = "DMV Notice Tracker"
description = "Caltrans demo notice and employee driving eligibility case management with fictional data."
version = "1.0.0"
id = "artifacts/dmv-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21695

[services.development]
run = "pnpm --filter @workspace/dmv-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dmv-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/dmv-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21695"
BASE_PATH = "/"
